<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de Prisma</title>
<meta name="description" content="Estado en vivo de Prisma y sus servicios.">
<meta name="theme-color" content="#05060d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300e5ff'/%3E%3Cstop offset='1' stop-color='%23b06bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M16 3 29 27H3z' fill='url(%23g)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #05060d; --panel: rgba(14, 18, 36, .62); --borde: rgba(120, 140, 255, .16); --borde-fuerte: rgba(120, 160, 255, .35);
    --texto: #e8ecff; --suave: #8b93b8; --tenue: #4b5274;
    --cian: #00e5ff; --violeta: #b06bff; --rosa: #ff4fd8;
    --ok: #2bffa6; --mal: #ff4d6d; --medio: #ffc24b; --gris: #6b7394;
    --mono: "JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --sans: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--fondo); }
  body {
    margin: 0; min-height: 100vh; color: var(--texto); font: 16px/1.5 var(--sans); background: var(--fondo);
    overflow-x: hidden;
  }
  /* Fondo: cuadrícula en perspectiva + resplandores */
  .cielo { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .cielo::before {
    content: ""; position: absolute; inset: -50% -50% 0; transform: perspective(600px) rotateX(62deg) translateY(30%);
    background-image: linear-gradient(rgba(0, 229, 255, .09) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(176, 107, 255, .09) 1px, transparent 1px);
    background-size: 56px 56px; mask-image: linear-gradient(to top, #000 10%, transparent 70%);
    animation: avanzar 6s linear infinite;
  }
  .cielo::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(600px 380px at 15% 0%, rgba(0, 229, 255, .16), transparent 70%),
                radial-gradient(700px 420px at 90% 10%, rgba(176, 107, 255, .18), transparent 70%),
                radial-gradient(500px 300px at 50% 110%, rgba(255, 79, 216, .10), transparent 70%);
  }
  @keyframes avanzar { to { background-position: 0 56px, 0 0; } }

  main { max-width: 880px; margin: 0 auto; padding: 36px 16px 48px; }

  /* Encabezado */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  .marca { display: flex; align-items: center; gap: 14px; }
  .prisma { width: 46px; height: 46px; filter: drop-shadow(0 0 14px rgba(0, 229, 255, .45)); }
  .prisma .haz { animation: refractar 4s ease-in-out infinite; transform-origin: 16px 16px; }
  @keyframes refractar { 50% { opacity: .35; transform: translateX(1px); } }
  h1 { margin: 0; font: 700 1.55rem/1 var(--sans); letter-spacing: .32em; text-transform: uppercase;
       background: linear-gradient(90deg, var(--cian), var(--violeta) 60%, var(--rosa)); -webkit-background-clip: text;
       background-clip: text; color: transparent; }
  .sub { margin: 6px 0 0; font: 400 .72rem/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--suave); }
  .vivo { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border: 1px solid var(--borde);
          border-radius: 999px; background: var(--panel); font: 600 .7rem/1 var(--mono); letter-spacing: .18em;
          text-transform: uppercase; color: var(--suave); backdrop-filter: blur(10px); }
  .vivo i { width: 8px; height: 8px; border-radius: 50%; background: var(--gris); }
  .vivo.on { color: var(--ok); border-color: rgba(43, 255, 166, .35); }
  .vivo.on i { background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: latido 1.6s ease-in-out infinite; }
  @keyframes latido { 50% { opacity: .3; } }

  /* Tarjeta principal */
  .hero {
    position: relative; display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center;
    padding: 26px; border-radius: 22px; border: 1px solid var(--borde); background: var(--panel);
    backdrop-filter: blur(14px); overflow: hidden; --c: var(--gris);
  }
  .hero::before { /* borde de neón */
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(120deg, var(--c), transparent 40%, transparent 60%, var(--violeta));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; opacity: .8;
  }
  .hero::after { /* barrido de escáner */
    content: ""; position: absolute; left: 0; right: 0; top: -40%; height: 40%; pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(0, 229, 255, .06), transparent);
    animation: escanear 5s linear infinite;
  }
  @keyframes escanear { to { top: 110%; } }
  .hero.ok { --c: var(--ok); } .hero.mal { --c: var(--mal); } .hero.medio { --c: var(--medio); }
  .orbe { position: relative; width: 112px; height: 112px; }
  .orbe svg { width: 100%; height: 100%; }
  .orbe .aro { fill: none; stroke: var(--c); stroke-width: 2; opacity: .9; filter: drop-shadow(0 0 6px var(--c)); }
  .orbe .aro2 { fill: none; stroke: var(--c); stroke-width: 1; stroke-dasharray: 4 9; opacity: .5;
                transform-origin: 60px 60px; animation: girar 14s linear infinite; }
  .orbe .nucleo { fill: var(--c); opacity: .9; filter: drop-shadow(0 0 16px var(--c)); transform-origin: 60px 60px;
                  animation: pulso 2.4s ease-in-out infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @keyframes pulso { 50% { transform: scale(.82); opacity: .55; } }
  .titular { margin: 0 0 6px; font: 700 clamp(1.3rem, 4vw, 1.9rem)/1.15 var(--sans); }
  .detalle { margin: 0 0 16px; color: var(--suave); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; gap: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--borde);
          background: rgba(5, 8, 20, .55); font: 400 .74rem/1.2 var(--mono); color: var(--suave); }
  .chip b { color: var(--texto); font-weight: 600; }

  /* Servicios */
  .titulo-seccion { margin: 34px 0 14px; font: 600 .72rem/1 var(--mono); letter-spacing: .26em; text-transform: uppercase;
                    color: var(--suave); display: flex; align-items: center; gap: 12px; }
  .titulo-seccion::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--borde-fuerte), transparent); }
  .grilla { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; list-style: none; margin: 0; padding: 0; }
  .servicio {
    position: relative; padding: 18px; border-radius: 16px; border: 1px solid var(--borde); background: var(--panel);
    backdrop-filter: blur(12px); transition: transform .25s, border-color .25s, box-shadow .25s; --c: var(--gris);
  }
  .servicio:hover { transform: translateY(-3px); border-color: var(--borde-fuerte); box-shadow: 0 10px 30px -12px var(--c); }
  .servicio::before { content: ""; position: absolute; left: 18px; right: 18px; top: 0; height: 2px; border-radius: 2px;
                      background: linear-gradient(90deg, transparent, var(--c), transparent); opacity: .9; }
  .servicio.operativo { --c: var(--ok); } .servicio.caido { --c: var(--mal); } .servicio.pausado { --c: var(--medio); }
  .fila { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .nombre { font: 700 1.08rem/1.2 var(--sans); }
  .estado { display: inline-flex; align-items: center; gap: 7px; font: 600 .68rem/1 var(--mono); letter-spacing: .14em;
            text-transform: uppercase; color: var(--c); white-space: nowrap; }
  .estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
  .operativo .estado i { animation: latido 2s ease-in-out infinite; }
  .desc { margin: 8px 0 0; color: var(--suave); font-size: .9rem; min-height: 1.4em; }
  .medidor { margin-top: 14px; font: 400 .7rem/1 var(--mono); color: var(--suave); }
  .medidor .barra { height: 4px; margin-top: 7px; border-radius: 4px; background: rgba(120, 140, 255, .12); overflow: hidden; }
  .medidor .barra span { display: block; height: 100%; border-radius: inherit;
                         background: linear-gradient(90deg, var(--cian), var(--c)); box-shadow: 0 0 8px var(--c); }

  /* Pie */
  footer { margin-top: 30px; font: 400 .74rem/1.6 var(--mono); color: var(--suave); }
  .recarga { height: 2px; margin-bottom: 12px; border-radius: 2px; background: rgba(120, 140, 255, .1); overflow: hidden; }
  .recarga span { display: block; height: 100%; width: 100%; transform-origin: left;
                  background: linear-gradient(90deg, var(--cian), var(--violeta)); animation: cuenta 60s linear forwards; }
  @keyframes cuenta { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .pie { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  footer a { color: var(--cian); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    .hero { grid-template-columns: 1fr; justify-items: start; padding: 22px; }
    .orbe { width: 88px; height: 88px; }
    h1 { letter-spacing: .24em; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="cielo" aria-hidden="true"></div>
<main>
  <header>
    <div class="marca">
      <svg class="prisma" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e5ff"/><stop offset=".6" stop-color="#b06bff"/><stop offset="1" stop-color="#ff4fd8"/></linearGradient>
        </defs>
        <path d="M16 3 29 27H3z" fill="none" stroke="url(#pg)" stroke-width="1.8" stroke-linejoin="round"/>
        <path class="haz" d="M16 3 18 27" stroke="#00e5ff" stroke-width="1" opacity=".8"/>
        <path class="haz" d="M16 3 22 27" stroke="#ff4fd8" stroke-width="1" opacity=".6"/>
      </svg>
      <div>
        <h1>Prisma</h1>
        <p class="sub">Estado del sistema</p>
      </div>
    </div>
    <span id="senal" class="vivo"><i></i><span>Conectando</span></span>
  </header>

  <section id="hero" class="hero" aria-live="polite">
    <div class="orbe" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="aro" cx="60" cy="60" r="54"/>
        <circle class="aro2" cx="60" cy="60" r="44"/>
        <circle class="nucleo" cx="60" cy="60" r="18"/>
      </svg>
    </div>
    <div>
      <p id="titular" class="titular">Consultando…</p>
      <p id="detalle" class="detalle">Estableciendo conexión con Prisma.</p>
      <div class="chips">
        <span class="chip">Servidor <b id="chip-servidor">—</b></span>
        <span class="chip">Servicios <b id="chip-servicios">—</b></span>
        <span class="chip">Última señal <b id="chip-senal">—</b></span>
      </div>
    </div>
  </section>

  <h2 class="titulo-seccion">Servicios</h2>
  <ul id="lista" class="grilla"></ul>

  <footer>
    <div class="recarga" aria-hidden="true"><span id="recarga"></span></div>
    <div class="pie">
      <span id="pie">Consultando a Prisma…</span>
      <a href="https://hyperion.is-a.dev/">hyperion.is-a.dev</a>
    </div>
  </footer>
</main>
<script>
  const ETIQUETA = { operativo: "En línea", caido: "Fuera de servicio", pausado: "En pausa", sin_datos: "Sin datos", apagado: "Apagado" };
  const $ = id => document.getElementById(id);
  const fecha = iso => iso ? new Date(iso).toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" }) : "";
  const hace = iso => {
    const s = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
    if (s < 60) return `hace ${s} s`;
    const min = Math.round(s / 60);
    return min < 60 ? `hace ${min} min` : `hace ${Math.round(min / 60)} h`;
  };
  let ultimo = null;

  function tarjeta(s) {
    const est = s.estado || "sin_datos";
    const li = document.createElement("li");
    li.className = `servicio ${est}`;
    li.innerHTML = `<div class="fila"><span class="nombre"></span><span class="estado"><i></i><span></span></span></div>
                    <p class="desc"></p>`;
    li.querySelector(".nombre").textContent = s.nombre;
    li.querySelector(".estado span").textContent = ETIQUETA[est] || est;
    li.querySelector(".desc").textContent = s.descripcion || "";
    if (typeof s.porcentaje_7d === "number") {
      const m = document.createElement("div");
      m.className = "medidor";
      const pct = Math.max(0, Math.min(100, s.porcentaje_7d));
      m.innerHTML = `<span></span><div class="barra"><span></span></div>`;
      m.firstChild.textContent = `Disponibilidad 7 días · ${pct.toLocaleString("es-CL", { maximumFractionDigits: 1 })} %`;
      m.querySelector(".barra span").style.width = `${pct}%`;
      li.append(m);
    } else if (s.desde && est === "operativo") {
      const m = document.createElement("div");
      m.className = "medidor";
      m.textContent = `En línea desde ${fecha(s.desde)}`;
      li.append(m);
    }
    return li;
  }

  function pintar(d) {
    ultimo = d;
    $("lista").replaceChildren(...d.servicios.map(tarjeta));
    const hero = $("hero"), caidos = d.servicios.filter(s => s.estado === "caido").length;
    const enLinea = d.servicios.filter(s => s.estado === "operativo" || s.estado === "pausado").length;
    if (d.servidor && d.servidor.estado === "caido") {
      hero.className = "hero mal";
      $("titular").textContent = "Servidor fuera de servicio";
      $("detalle").textContent = `Desde ${fecha(d.servidor.caido_desde)}. Ya se está trabajando para recuperarlo.`;
    } else if (d.servidor && d.servidor.estado === "sin_conexion") {
      hero.className = "hero mal";
      $("titular").textContent = "Sin conexión con Prisma";
      $("detalle").textContent = "Prisma no responde en este momento. Se muestra la última revisión guardada.";
    } else if (caidos) {
      hero.className = "hero medio";
      $("titular").textContent = caidos === 1 ? "Un servicio tiene problemas" : `${caidos} servicios tienen problemas`;
      $("detalle").textContent = "Prisma funciona; algunos servicios no responden.";
    } else {
      hero.className = "hero ok";
      $("titular").textContent = "Todos los sistemas operativos";
      $("detalle").textContent = "Todo funciona con normalidad.";
    }
    $("chip-servidor").textContent = (d.servidor && d.servidor.nombre) || "—";
    $("chip-servicios").textContent = `${enLinea}/${d.servicios.length} en línea`;
    const senal = $("senal");
    senal.className = d.vivo ? "vivo on" : "vivo";
    senal.lastChild.textContent = d.vivo ? "En vivo" : "Sin señal";
    $("pie").textContent = d.vivo ? "Datos directos de Prisma · se actualiza cada minuto"
                                  : "Prisma no responde · última revisión guardada por GitHub";
    reloj();
  }

  function reloj() {
    if (ultimo && ultimo.actualizado) $("chip-senal").textContent = hace(ultimo.actualizado);
  }

  function reiniciarCuenta() {
    const barra = $("recarga");
    barra.style.animation = "none";
    void barra.offsetWidth;
    barra.style.animation = "";
  }

  // En vivo: se le pregunta directo a Prisma (a sus dos casas posibles; gana la primera que responde).
  // Si ninguna responde, se usa la última revisión guardada por GitHub (estado.json de esta página).
  const VIVO = [["Oracle", "https://prisma.tail53ad1c.ts.net/estado.json"],
                ["Azure", "https://prisma-azure.tail87f042.ts.net/estado.json"]];
  const pedir = (url, ms) => fetch(url, { cache: "no-store", signal: AbortSignal.timeout(ms) })
    .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)));

  async function actualizar() {
    reiniciarCuenta();
    try {
      const d = await Promise.any(VIVO.map(([nombre, url]) => pedir(url, 8000).then(x => {
        if (!x.servicios || !x.servicios.length) throw new Error("vacío");
        return { ...x, vivo: true, servidor: { estado: "operativo", nombre } };
      })));
      pintar(d);
    } catch {
      try {
        const d = await pedir("estado.json", 15000);
        if (!d.servidor || d.servidor.estado !== "caido") {
          // GitHub alcanzó a verla en línea, pero ahora no responde: se avisa sin inventar desde cuándo.
          d.servidor = { estado: "sin_conexion" };
          d.servicios = d.servicios.map(s => s.nombre === "Prisma" ? { ...s, estado: "caido" } : s);
        }
        pintar(d);
      } catch {
        $("hero").className = "hero medio";
        $("titular").textContent = "No pude cargar el estado";
        $("detalle").textContent = "Intenta de nuevo en unos minutos.";
      }
    }
  }
  actualizar();
  setInterval(actualizar, 60000);
  setInterval(reloj, 1000);
</script>
</body>
</html>
