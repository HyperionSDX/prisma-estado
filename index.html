<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de Prisma</title>
<meta name="description" content="Estado en vivo de Prisma y sus servicios.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 29 27H3z' fill='%237c6cf2'/%3E%3C/svg%3E">
<style>
  :root {
    --fondo: #f6f5fb; --tarjeta: #ffffff; --texto: #1d1b2c; --suave: #6b6880; --borde: #e4e1f0;
    --acento: #7c6cf2; --ok: #1f9d55; --mal: #d64545; --medio: #c98a12; --gris: #8a879b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #12111a; --tarjeta: #1c1a27; --texto: #ecebf5; --suave: #a29fb6; --borde: #2c2a3b;
            --acento: #9d90ff; --ok: #3cc47c; --mal: #ff6b6b; --medio: #f0b440; --gris: #77748a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 40px 16px 56px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  header svg { width: 36px; height: 36px; flex: none; }
  h1 { font-size: 1.5rem; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--suave); font-size: .9rem; margin: 0; }
  .resumen { border-radius: 14px; padding: 18px 20px; margin-bottom: 20px; color: #fff; font-weight: 600;
             display: block; }
  .resumen.ok { background: var(--ok); } .resumen.mal { background: var(--mal); } .resumen.medio { background: var(--medio); }
  .resumen.cargando { background: var(--gris); }
  .resumen small { display: block; font-weight: 400; opacity: .9; margin-top: 2px; }
  ul { list-style: none; margin: 0; padding: 0; background: var(--tarjeta); border: 1px solid var(--borde);
       border-radius: 14px; overflow: hidden; }
  li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; }
  li + li { border-top: 1px solid var(--borde); }
  .nombre { font-weight: 600; } .desc { color: var(--suave); font-size: .88rem; }
  .estado { display: inline-flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 600; white-space: nowrap; }
  .punto { width: 10px; height: 10px; border-radius: 50%; background: var(--gris); }
  .operativo .punto { background: var(--ok); } .caido .punto { background: var(--mal); }
  .pausado .punto { background: var(--medio); }
  footer { color: var(--suave); font-size: .82rem; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<main>
  <header>
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 27H3z" fill="var(--acento)"/><path d="M16 3v24" stroke="var(--fondo)" stroke-width="1.5" opacity=".6"/></svg>
    <div>
      <h1>Estado de Prisma</h1>
      <p class="sub">Asistente personal y sus servicios</p>
    </div>
  </header>
  <div id="resumen" class="resumen cargando">Consultando…</div>
  <ul id="lista" aria-live="polite"></ul>
  <footer id="pie">Se revisa cada 10 minutos.</footer>
</main>
<script>
  const ETIQUETA = { operativo: "En línea", caido: "Fuera de servicio", pausado: "En pausa", sin_datos: "Sin datos", apagado: "Apagado" };
  const fecha = iso => iso ? new Date(iso).toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" }) : "";
  const hace = iso => {
    const min = Math.round((Date.now() - new Date(iso)) / 60000);
    return min < 1 ? "hace un momento" : min < 60 ? `hace ${min} min` : `hace ${Math.round(min / 60)} h`;
  };
  function pintar(d) {
    const lista = document.getElementById("lista"), resumen = document.getElementById("resumen");
    lista.replaceChildren(...d.servicios.map(s => {
      const li = document.createElement("li"), est = s.estado || "sin_datos";
      const izq = document.createElement("div");
      izq.innerHTML = `<div class="nombre"></div><div class="desc"></div>`;
      izq.firstChild.textContent = s.nombre;
      izq.lastChild.textContent = s.descripcion || "";
      const der = document.createElement("span");
      der.className = `estado ${est}`;
      der.innerHTML = `<span class="punto"></span><span></span>`;
      der.lastChild.textContent = ETIQUETA[est] || est;
      li.append(izq, der);
      return li;
    }));
    const caidos = d.servicios.filter(s => s.estado === "caido").length;
    if (d.servidor && d.servidor.estado === "caido") {
      resumen.className = "resumen mal";
      resumen.innerHTML = `Servidor fuera de servicio<small></small>`;
      resumen.lastChild.textContent = `Desde ${fecha(d.servidor.caido_desde)}. Ya se está trabajando para recuperarlo.`;
    } else if (caidos) {
      resumen.className = "resumen medio";
      resumen.textContent = caidos === 1 ? "Un servicio tiene problemas" : `${caidos} servicios tienen problemas`;
    } else {
      resumen.className = "resumen ok";
      resumen.textContent = "Todo funciona con normalidad";
    }
    if (d.servidor && d.servidor.estado !== "caido" && d.servidor.nombre) {
      const donde = document.createElement("small");
      donde.textContent = `Servidor: ${d.servidor.nombre}`;
      resumen.append(donde);
    }
    document.getElementById("pie").textContent = `Actualizado ${hace(d.actualizado)} · se revisa cada 10 minutos.`;
  }
  fetch("estado.json", { cache: "no-store" }).then(r => r.json()).then(pintar).catch(() => {
    const r = document.getElementById("resumen");
    r.className = "resumen medio"; r.textContent = "No pude cargar el estado. Intenta de nuevo en unos minutos.";
  });
</script>
</body>
</html>
