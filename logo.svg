<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Prisma · logo «Aurora»: un prisma de vidrio que separa la luz en los colores de la aurora.
       Ocupa todo el cuadrado (sirve como ícono «maskable»); lo importante queda dentro del 80 % central. -->
  <defs>
    <radialGradient id="cielo" cx="50%" cy="28%" r="85%">
      <stop offset="0" stop-color="#1c1648"/>
      <stop offset=".55" stop-color="#0a0a22"/>
      <stop offset="1" stop-color="#04040c"/>
    </radialGradient>
    <radialGradient id="aurora1" cx="22%" cy="30%" r="45%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aurora2" cx="82%" cy="74%" r="50%">
      <stop offset="0" stop-color="#d946ef" stop-opacity=".30"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haz" x1="44" y1="298" x2="176" y2="262" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="180" y1="120" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cffafe" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#c4b5fd" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fbcfe8" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="nacar" x1="140" y1="120" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset=".35" stop-color="#c4b5fd"/>
      <stop offset=".7" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="r1" x1="329" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/></linearGradient>
    <linearGradient id="r2" x1="329" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient>
    <linearGradient id="r3" x1="329" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></linearGradient>
    <linearGradient id="r4" x1="329" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
    <linearGradient id="r5" x1="329" y1="0" x2="490" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="suave" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#cielo)"/>
  <rect width="512" height="512" fill="url(#aurora1)"/>
  <rect width="512" height="512" fill="url(#aurora2)"/>
  <g fill="#fff">
    <circle cx="96" cy="118" r="1.6" opacity=".8"/><circle cx="410" cy="96" r="1.3" opacity=".6"/>
    <circle cx="448" cy="168" r="1.8" opacity=".7"/><circle cx="70" cy="402" r="1.2" opacity=".5"/>
    <circle cx="150" cy="70" r="1" opacity=".6"/><circle cx="378" cy="430" r="1.4" opacity=".5"/>
  </g>

  <!-- haz de luz blanca que entra -->
  <line x1="44" y1="298" x2="176" y2="262" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".35" filter="url(#brillo)"/>
  <line x1="44" y1="298" x2="176" y2="262" stroke="url(#haz)" stroke-width="5" stroke-linecap="round"/>

  <!-- abanico de colores que sale -->
  <g filter="url(#suave)">
    <polygon points="329,240 492,168 492,200" fill="url(#r1)"/>
    <polygon points="329,244 492,206 492,240" fill="url(#r2)"/>
    <polygon points="329,248 492,246 492,282" fill="url(#r3)"/>
    <polygon points="329,252 492,288 492,322" fill="url(#r4)"/>
    <polygon points="329,256 492,328 492,362" fill="url(#r5)"/>
  </g>

  <!-- el prisma -->
  <polygon points="256,116 378,336 134,336" fill="url(#nacar)" opacity=".28" filter="url(#brillo)"/>
  <polygon points="256,116 378,336 134,336" fill="url(#vidrio)" stroke="url(#nacar)" stroke-width="7" stroke-linejoin="round"/>
  <!-- reflejos del vidrio -->
  <path d="M248 150 L170 302" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/>
  <!-- donde la luz entra y sale -->
  <circle cx="176" cy="262" r="7" fill="#fff" filter="url(#suave)"/>
  <circle cx="329" cy="250" r="6" fill="#fff" opacity=".85" filter="url(#suave)"/>
</svg>
