name: Actualizar estado

# Cada 10 minutos pregunta al panel de Prisma cómo están los servicios y publica la página (GitHub Pages).
# Si el servidor no responde, la página lo muestra como caído (por eso vive aquí y no en el servidor).
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Consultar a Prisma
        run: python actualizar.py
      - name: Guardar el historial si cambió algo
        run: |
          if [ "$(cat cambio.txt)" = "si" ]; then
            git config user.name "Prisma Estado"
            git config user.email "prisma-estado@users.noreply.github.com"
            git add estado.json && git commit -m "Estado: $(python -c 'import json;print(json.load(open("estado.json"))["servidor"]["estado"])')" && git push
          fi
      - name: Armar el sitio
        run: cp index.html logo.svg sitio/ && touch sitio/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
